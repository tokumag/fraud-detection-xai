# Project configuration
project:
  name: fraud-detection-xai
  version: "1.0.0"
  random_seed: 42

# Data generation settings (synthetic dataset)
data:
  n_samples: 50000
  fraud_ratio: 0.02          # 2% fraud — realistic class imbalance
  n_features: 20
  output_path: data/transactions.csv

# Preprocessing
preprocessing:
  test_size: 0.2
  scaling_method: standard   # standard | minmax | robust
  handle_imbalance: smote    # smote | adasyn | none

# Model training
model:
  algorithm: xgboost         # xgboost | random_forest | logistic_regression
  xgboost:
    n_estimators: 300
    max_depth: 6
    learning_rate: 0.1
    scale_pos_weight: auto   # auto-calculated from class ratio
    eval_metric: aucpr
    early_stopping_rounds: 20
  random_forest:
    n_estimators: 200
    max_depth: 10
    class_weight: balanced
  logistic_regression:
    C: 1.0
    class_weight: balanced
    max_iter: 1000

# Explainability
explainability:
  shap_max_samples: 500      # samples for SHAP computation
  top_k_features: 10         # top features to display
  generate_plots: true

# Model artifacts
artifacts:
  model_path: models/fraud_model.joblib
  preprocessor_path: models/preprocessor.joblib
  metrics_path: models/metrics.json
